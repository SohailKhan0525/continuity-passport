name: Continuity Passport
on:
  push:
    branches: [main]
  workflow_dispatch:
jobs:
  continuity:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check continuity evidence
        shell: bash
        run: |
          set -e
          missing=0
          for file in README.md package.json; do
            if [ ! -f "$file" ]; then echo "Missing: $file"; missing=1; fi
          done
          if [ ! -f ".env.example" ] && [ ! -f ".env.sample" ]; then echo "Needs confirmation: no environment example file found"; fi
          if [ "$missing" -ne 0 ]; then exit 1; fi
          echo "Continuity evidence baseline passed."